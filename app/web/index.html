<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HUE HERITAGE MUSIC - AI Preserving, Teaching & Restoring Hue Traditional Music (Ca Hue, Court Music, Traditional Instruments).">
  <meta name="theme-color" content="#5B3B8C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hue Heritage Music">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>HUE HERITAGE MUSIC - AI Di sản Âm nhạc Huế</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0E0F17;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #24143D 0%, #0E0F17 100%);
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }
    .logo-box {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      background: linear-gradient(135deg, #5B3B8C, #8B5CF6);
      box-shadow: 0 10px 30px rgba(91, 59, 140, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .logo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .brand-title {
      color: #FFFFFF;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .brand-subtitle {
      color: #D4AF37;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 3px solid rgba(139, 92, 246, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="logo-box">
      <img src="favicon.png" alt="Hue Heritage Music Logo" onerror="this.style.display='none'">
    </div>
    <div class="brand-title">HUE HERITAGE MUSIC</div>
    <div class="brand-subtitle">Nền tảng AI Di sản Huế</div>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
