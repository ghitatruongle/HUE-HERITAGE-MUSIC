name: hue_heritage_music
description: HUE HERITAGE MUSIC - AI bao ton di san am nhac Hue (Flutter client).
publish_to: "none"
version: 0.0.0-alpha2+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  just_audio: ^0.9.46
  just_audio_windows: ^0.2.1
  record: ^7.1.1
  fl_chart: ^0.69.0
  provider: ^6.1.2
  shared_preferences: ^2.2.0
  cross_file: ^0.3.5
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.5
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - GHITA_API.example.json
