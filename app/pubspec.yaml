name: hue_heritage_music
description: HUE HERITAGE MUSIC - AI bảo tồn di sản âm nhạc Huế (Flutter client).
publish_to: "none"
version: 0.0.1+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  just_audio: ^0.9.46
  just_audio_windows: ^0.2.1
  record: ^7.1.1
  fl_chart: ^0.69.0
  provider: ^6.1.2
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  flutter_secure_storage: ^9.2.2
  cross_file: ^0.3.5
  file_picker: ^8.1.2
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.0
  web: ^1.1.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.6

flutter_launcher_icons:
  image_path: "assets/images/app_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter_native_splash:
  color: "#2A1545"
  image: "assets/images/app_logo.png"
  android_12:
    color: "#2A1545"
    image: "assets/images/app_logo.png"
    icon_background_color: "#2A1545"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - GHITA_API.example.json
